name: Uji rumus
on: [push, pull_request]
jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
      - run: python3 tools/build_datamodel.py && git diff --exit-code -- datamodel js/core/datamodel.js
