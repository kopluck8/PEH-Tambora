<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEH Tambora</title>
<meta name="description" content="Kalkulator analisis data serta generator RPK dan LPK kegiatan teknis Pengendali Ekosistem Hutan Balai TN Tambora.">
<link rel="stylesheet" href="css/style.css">

<body>
<header class="app-head noprint">

    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M12 2 3 6v6c0 5 3.8 9.4 9 10 5.2-.6 9-5 9-10V6l-9-4Zm0 2.2 7 3.1V12c0 3.9-2.9 7.4-7 8-4.1-.6-7-4.1-7-8V7.3l7-3.1ZM8 15l2.5-4 2 2.5L14.5 9 17 15H8Z"/></svg>

  </div>
</header>

<div class="keg-pick noprint">

  <select id="kegSel"></select>
  <p class="muted" id="kegDesc"></p>
</div>
<nav class="tabs noprint" role="tablist" aria-label="Tahap">

  <button type="button" role="tab" class="tab on" data-tab="data">Data <small>isian lapangan</small></button>
  <button type="button" role="tab" class="tab" data-tab="hasil">Hasil Analisis <small>kalkulator</small></button>
  <button type="button" role="tab" class="tab" data-tab="lpk">LPK <small>laporan</small></button>
</nav>

<main class="layout">
  <aside class="side noprint" id="side"></aside>
  <div class="main" id="main"></div>
</main>
